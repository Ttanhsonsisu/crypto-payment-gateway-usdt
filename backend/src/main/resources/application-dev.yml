server:
  port: 8081
  servlet:
    context-path: /

spring:
  datasource:
    url: jdbc:postgresql://163.44.206.213:5432/devnmdb
    username: devnm
    password: devnm123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
    generate-ddl: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  # Redis Configuration for dev
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      jedis:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

# HD Wallet Configuration for dev
wallet:
  encryption:
    # Secret key for AES-256 encryption (USE ENVIRONMENT VARIABLE)
    secret: ${WALLET_ENCRYPTION_SECRET:aPV766seKZwuXNNf71b8eh0S9i0RxG3l6cw+ocntIKI=}

  mnemonic:
    seed: ${WALLET_MNEMONIC_SEED:} # Will generate new if empty

  pool:
    initialSize: 1000  # Generate 1000 child wallets on startup
    minThreshold: 200  # Minimum free wallets before generating more
    batchSize: 500     # How many to generate at once when needed

  master:
    minTrxBalance: 100 # Minimum TRX balance required for master wallet

# Tron Configuration for dev (Nile testnet)
tron:
  api:
    url: https://nile.trongrid.io  # Nile Testnet API
    key: ${TRON_API_KEY:bf5a9e49-d910-4283-8a5b-9669d41281b9}  # Optional TronGrid API key for higher limits

  usdt:
    contract: TXYZopYRdj2D9XRtbG411XZZ3kM5VkAeBf  # USDT TRC20 contract on Nile testnet

  network:
    name: nile
    confirmations: 3  # Faster confirmations on testnet

# Deposit Scanner Configuration (Optimized for Nile testnet)
deposit:
  scanner:
    enabled: true
    confirmations:
      required: 3  # Lower confirmations for testnet
    block:
      batch:
        size: 50  # Smaller batch for faster processing
    min:
      amount: 0.1  # Lower minimum for testing (0.1 USDT)
    schedule:
      fixed:
        delay: 15000  # Scan every 15 seconds (faster for testnet)

# USDT Sweep Configuration (Testnet optimized)
sweep:
  enabled: true
  min:
    amount: 1  # Lower minimum for testnet (1 USDT)
  gas:
    limit: 10  # Lower gas limit for testnet
  batch:
    size: 5  # Smaller batches for testing
  schedule:
    fixed:
      delay: 180000  # Sweep every 3 minutes (faster)

# Points System Configuration
points:
  exchange:
    rate: 1.0  # 1 USDT = 1 Point
  transfer:
    fee: 0.0  # 0% fee for P2P transfers
    min:
      amount: 0.01  # Minimum transfer amount
  cache:
    ttl: 600  # Balance cache TTL in seconds (10 minutes)

# Logging
logging:
  level:
    com.UsdtWallet: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.security: DEBUG
    com.UsdtWallet.UsdtWallet.security: DEBUG
  file:
    name: logs/application.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
