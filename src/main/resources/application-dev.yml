server:
  port: 8081
  servlet:
    context-path: /

spring:
  datasource:
    url: jdbc:postgresql://163.44.206.213:5432/devnmdb
    username: devnm
    password: devnm123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
    generate-ddl: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  # Redis Configuration for dev
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      jedis:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

# HD Wallet Configuration for dev
wallet:
  mnemonic:
    seed: ${WALLET_MNEMONIC_SEED:} # Will generate new if empty

  pool:
    initialSize: 1000  # Generate 1000 child wallets on startup
    minThreshold: 200  # Minimum free wallets before generating more
    batchSize: 500     # How many to generate at once when needed

  master:
    minTrxBalance: 100 # Minimum TRX balance required for master wallet

# Tron Configuration for dev (Nile testnet)
tron:
  api:
    url: https://api.trongrid.io
  network:
    name: nile
    fullHost: https://nile.trongrid.io
    apiKey: ${TRON_API_KEY:your-api-key-here}

  contracts:
    usdt: TG3XXyExBkPp9nzdajDZsozEu4BkaSJozs  # USDT on Nile testnet

# Development-specific settings
logging:
  level:
    com.UsdtWallet.UsdtWallet: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
